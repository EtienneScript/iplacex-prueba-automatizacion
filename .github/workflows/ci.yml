name: CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:

jobs:
  pipeline:
    name: Tests, acceptance y despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: |
          chmod +x mvnw scripts/desplegar-ambiente-prueba.sh
          ./mvnw -B -DskipUnitTests=true -DskipITs=true -DskipATs=true compile

      - name: Tests
        run: |
          ./mvnw -B test -DskipITs=true -DskipATs=true
          ./mvnw -B verify -DskipUnitTests=true -DskipATs=true -Dheadless=true

      - name: Acceptance
        run: ./mvnw -B verify -DskipUnitTests=true -DskipITs=true -Dheadless=true

      - name: Despliegue ambiente de prueba
        run: |
          ./mvnw -B -DskipUnitTests=true -DskipITs=true -DskipATs=true package
          ./scripts/desplegar-ambiente-prueba.sh

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn

      - name: Publicar reportes de acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-acceptance
          path: target/failsafe-reports-at/**
          if-no-files-found: warn

      - name: Publicar ambiente de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ambiente-prueba
          path: ambiente-prueba/**
